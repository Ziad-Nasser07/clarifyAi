name: clarifyai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # AI & Networking
  google_generative_ai: ^0.4.6
  dio: ^5.7.0
  flutter_dotenv: ^5.1.0

  # Files, Camera & UI
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_markdown: ^0.7.4
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/app.env